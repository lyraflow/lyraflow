name: CI
on:
  push: { branches: [main] }
  pull_request:
  # Lets CI run on demand from the Actions tab, so a workflow change can be
  # re-verified without pushing a throwaway commit.
  workflow_dispatch:

# Cancel a superseded run rather than paying for it. PR #121 -- a UI branch --
# ran this workflow nine times, and eight of those were obsolete before they
# finished (see #130).
#
# The group is deliberately asymmetric, for the same reason the triggers below
# are. A pull request groups by PR number, so a new push cancels the run for the
# commit it replaced. Everything else -- `push` to main, `workflow_dispatch` --
# falls back to `run_id`, which is unique per run, so those runs are never
# cancelled and never queued behind one another. A cancelled `main` run would be
# a hole in exactly the place these workflows refuse to have one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `version:` here on purpose. package.json pins `packageManager`,
      # and pnpm/action-setup errors out if both are set. The pin is the one
      # that matters: an unpinned corepack fetches whatever pnpm is current,
      # which has already broken this build once.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Biome does not read shell, and these are the scripts standing between an
      # operator and their only copy of their data -- restore.sh is also the
      # only thing in the repository that deletes any of it. shellcheck is
      # preinstalled on the GitHub runners, so this adds a dependency to CI
      # only, not to the product.
      #
      # All four in ONE invocation, deliberately: backup.sh and restore.sh both
      # source backup-lib.sh, and shellcheck only follows that source when the
      # sourced file is part of the same input set. Split into separate runs it
      # still passes, but blind to every use of a helper.
      #
      # `pnpm exec`, not the runner's preinstalled `shellcheck`. The two are
      # different versions and they disagree: a bare `shellcheck` passed on a
      # developer machine running 0.11 and failed here on SC2015, which is a
      # lint you cannot reproduce locally and therefore cannot fix with
      # confidence. Pinning it in devDependencies makes the two identical.
      - name: Lint shell scripts
        run: pnpm exec shellcheck backup.sh backup-lib.sh restore.sh install.sh
      - run: pnpm lint
      - run: pnpm typecheck
      # `pnpm typecheck` (tsc -b) emits every package's TypeScript output, which
      # used to be enough for the suite. It is not any more: the browser SDK's
      # shipped artefact is an esbuild IIFE produced by its own build script,
      # and tsc never runs that. Without this step `bundle-size.test.ts`,
      # `snippet.test.ts` and the SDK route tests all fail on a missing
      # dist/lyraflow.js — which is exactly what they are written to say, and
      # exactly what this branch's first CI run said.
      - run: pnpm build
      - run: docker compose -f docker-compose.test.yml up -d --wait
      - run: pnpm test

  durability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `version:` here on purpose. package.json pins `packageManager`,
      # and pnpm/action-setup errors out if both are set. The pin is the one
      # that matters: an unpinned corepack fetches whatever pnpm is current,
      # which has already broken this build once.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm vitest run --config vitest.durability.config.ts

  # A separate job, not folded into `test` above: everything else in this
  # repo is a unit test against a fake client, run in jsdom against source.
  # This is the only check that exercises the built assets, the static
  # serving, the real cookie and the API together -- worth the cost of a
  # browser download and an image build, which do not belong gating every
  # push the way `test` does.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `version:` here on purpose. package.json pins `packageManager`,
      # and pnpm/action-setup errors out if both are set. The pin is the one
      # that matters: an unpinned corepack fetches whatever pnpm is current,
      # which has already broken this build once.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # The browser is the expensive part; cache it on the lockfile so a run
      # that changes no dependency does not re-download it.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm --filter @lyraflow/ui exec playwright install chromium --with-deps
      - run: pnpm build
      # An EMPTY database, deliberately: the wizard only appears when there
      # are no projects, and it is the whole point of this test.
      - name: Start the stack
        run: |
          printf 'POSTGRES_PASSWORD=e2e\nCLICKHOUSE_PASSWORD=e2e\n' > .env
          printf 'LYRAFLOW_ADMIN_EMAIL=%s\n' "$LYRAFLOW_ADMIN_EMAIL" >> .env
          printf 'LYRAFLOW_ADMIN_PASSWORD=%s\n' "$LYRAFLOW_ADMIN_PASSWORD" >> .env
          docker compose up -d --build --wait
        env:
          LYRAFLOW_ADMIN_EMAIL: admin@localhost
          LYRAFLOW_ADMIN_PASSWORD: e2e-admin-password
      - run: pnpm --filter @lyraflow/ui exec playwright test
        env:
          LYRAFLOW_ADMIN_EMAIL: admin@localhost
          LYRAFLOW_ADMIN_PASSWORD: e2e-admin-password
      # A failing E2E with no trace is a test you cannot act on.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: packages/ui/playwright-report/

