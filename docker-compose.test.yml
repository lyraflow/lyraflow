services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    ports: ["8123:8123"]
    environment:
      CLICKHOUSE_DB: lyraflow_test
      CLICKHOUSE_USER: lyraflow
      CLICKHOUSE_PASSWORD: lyraflow
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
  postgres:
    image: postgres:17-alpine
    ports: ["5433:5432"]
    environment:
      POSTGRES_DB: lyraflow_test
      POSTGRES_USER: lyraflow
      POSTGRES_PASSWORD: lyraflow
