services:
  lyraflow:
    image: ghcr.io/lyraflow/lyraflow:0
    # `image:` and `build:` together: Compose uses the named image when it is
    # available and builds from this checkout (tagging the result with that
    # same name) when it is not. Until the image is published, `install.sh`'s
    # `docker compose pull || docker compose build` is what makes a fresh clone
    # work; once it is published, the pull wins and nothing here changes.
    build: .
    restart: unless-stopped
    # Without an init process reaping PID 1, the kernel *ignores* an
    # unhandled SIGTERM sent to PID 1 instead of terminating it — so a
    # missing or broken shutdown handler would silently survive every
    # restart/stop until SIGKILL, rather than surfacing as a failure.
    init: true
    depends_on:
      clickhouse: { condition: service_healthy }
      postgres: { condition: service_healthy }
    environment:
      LYRAFLOW_PORT: 3000
      LYRAFLOW_POSTGRES_URL: postgres://lyraflow:${POSTGRES_PASSWORD}@postgres:5432/lyraflow
      LYRAFLOW_CLICKHOUSE_URL: http://clickhouse:8123
      LYRAFLOW_CLICKHOUSE_USER: lyraflow
      LYRAFLOW_CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      LYRAFLOW_CLICKHOUSE_DB: lyraflow
      # `:-` for the same reason LYRAFLOW_DOMAIN gets it below (Caddy's own
      # block): an install whose .env predates the admin account has neither
      # variable, and without the fallback every `up`/`ps`/`exec` warns
      # "variable is not set" for something that is a legitimate, documented
      # state (see auth/bootstrap.ts's `not_configured` outcome), not an
      # error. Compose passes the container only the variables this block
      # names — omitting these two here would leave `LYRAFLOW_ADMIN_EMAIL`/
      # `LYRAFLOW_ADMIN_PASSWORD` sitting in `.env` and never reaching
      # `loadConfig`, no matter what install.sh wrote.
      LYRAFLOW_ADMIN_EMAIL: ${LYRAFLOW_ADMIN_EMAIL:-}
      LYRAFLOW_ADMIN_PASSWORD: ${LYRAFLOW_ADMIN_PASSWORD:-}
    # Interpolated so domain mode can drop this to loopback without a second
    # compose file. Unset it is 3000:3000 -- byte-for-byte today's behaviour.
    # The three-part IP:host:container form is required in domain mode;
    # "127.0.0.1:3000" alone parses as hostPort:containerPort and is rejected.
    ports: ["${LYRAFLOW_PUBLISH:-3000:3000}"]
    # Must exceed LYRAFLOW_DRAIN_DEADLINE_MS (25s default), or SIGKILL will
    # interrupt the drain and accepted events will be lost on every upgrade.
    stop_grace_period: 30s
    # 127.0.0.1, never localhost: localhost can resolve to ::1 first, and the
    # server binds 0.0.0.0 (IPv4 only), so a localhost probe fails permanently.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  caddy:
    image: caddy:2-alpine
    # Inactive unless COMPOSE_PROFILES names it, which install.sh writes into
    # .env only when a domain was given. An install with no domain never pulls
    # this image and never binds 80 or 443.
    profiles: ["tls"]
    restart: unless-stopped
    depends_on:
      lyraflow: { condition: service_healthy }
    environment:
      # `:-` so an install with no domain does not get "variable is not set"
      # on every `up`, `ps` and `exec` -- including the ones backup.sh and
      # restore.sh run. The tls profile is inactive in that case, so the empty
      # value is never read by anything.
      LYRAFLOW_DOMAIN: ${LYRAFLOW_DOMAIN:-}
    ports: ["80:80", "443:443"]
    # Without this, `up -d --wait` only requires that Caddy *started*, and
    # `restart: unless-stopped` turns a config error into a crash-loop that
    # Compose reports as "Healthy" before exiting 0. Two ways in: a .env with
    # COMPOSE_PROFILES=tls and no LYRAFLOW_DOMAIN (the Caddyfile's
    # `{$$LYRAFLOW_DOMAIN}` becomes a bare `{`, so the site block parses as a
    # global options block and Caddy dies on `unrecognized global option:
    # reverse_proxy`), and a typo in an operator's own tls.d file, which the
    # README sends people to write for the Cloudflare Origin CA case.
    #
    # The probe is Caddy's admin API rather than a request through the proxy.
    # It has to distinguish "config loaded and the site is provisioned" from
    # "crash-looping" WITHOUT also failing while a Let's Encrypt certificate
    # is still being issued -- that wait is documented as normal and must not
    # fail the install. Asking the reverse_proxy module for its upstreams is
    # exactly that line: it answers only once the site block provisioned, it
    # names the upstream so an empty or global-options-only config fails, and
    # it does not care whether a certificate exists yet.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS --max-time 5 http://127.0.0.1:2019/reverse_proxy/upstreams | grep -q 'lyraflow:3000'",
        ]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - "./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro"
      - "./docker/caddy/tls.d:/etc/caddy/tls.d:ro"
      # A named volume, and it must survive `down`: it holds the ACME account
      # key and the issued certificates. Re-issuing on every restart walks
      # into Let's Encrypt's duplicate-certificate rate limit, and the failure
      # arrives days later as an expiry rather than as an error now.
      - "caddy-data:/data"

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: lyraflow
      CLICKHOUSE_USER: lyraflow
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - "clickhouse-data:/var/lib/clickhouse"
      # Enables BACKUP/RESTORE. See the file's own comment for why it is
      # required rather than optional, and backup.sh for the cleanup this
      # implies.
      - "./docker/clickhouse/backup-disk.xml:/etc/clickhouse-server/config.d/backup-disk.xml:ro"
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    # Probe the container's own hostname, not loopback: these images run an
    # init-phase temporary server bound to loopback only, which would answer a
    # loopback probe and let `--wait` return before the real server binds.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- \"http://$$(hostname):8123/ping\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lyraflow
      POSTGRES_USER: lyraflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lyraflow -d lyraflow -h \"$$(hostname)\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  clickhouse-data:
  postgres-data:
  caddy-data:
