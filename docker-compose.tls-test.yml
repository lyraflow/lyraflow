# Overrides exactly two things -- where the certificate comes from, and what
# proxy.d holds (#271: a real `trusted_proxies` line, so `up --wait` in
# test/tls-proxy.test.ts is also the crash-loop regression test for that
# directive's spelling) -- so the suite exercises the shipped service
# definition, the shipped Caddyfile and the shipped profile. A test against a
# bespoke stack proves nothing about the one operators run.
#
# All four volumes are restated even though only the middle two change.
# Compose merges `volumes` by target path, so restating the others is a
# no-op -- but if it replaced the list wholesale instead, naming only tls.d
# would silently drop the Caddyfile mount and Caddy would start with no site
# block at all. Restating is correct under both readings; naming a subset is
# correct only under the first.
services:
  caddy:
    volumes:
      - "./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro"
      - "./test/fixtures/tls.d:/etc/caddy/tls.d:ro"
      - "./test/fixtures/proxy.d:/etc/caddy/proxy.d:ro"
      - "caddy-data:/data"
